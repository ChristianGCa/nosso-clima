name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@12.0.2
      - name: Install from the root lockfile
        run: npm ci
      - name: Static checks and unit tests
        run: npm run check
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility
        run: npm run test:a11y
      - name: Browser end-to-end
        run: npm run test:e2e
      - name: Mobile performance
        run: npm run test:performance
      - name: Upload performance profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-profile
          path: artifacts/performance.json
          if-no-files-found: ignore
      - name: Install verified Gitleaks binary
        run: |
          curl -fsSL --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan working tree and complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner
          "$RUNNER_TEMP/gitleaks" detect --redact --no-banner
